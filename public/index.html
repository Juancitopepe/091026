<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descarga</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
}

button{
    background:#cc0000;
    color:white;
    border:none;
    padding:20px 50px;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Press Start 2P', cursive;
}

    .tituloSuperior{
    position:fixed;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-family:'Press Start 2P', cursive;
    font-size:48px;
}

.textoInferior{
    position:fixed;
    bottom:20px;
    right:20px;
    color:white;
    font-family:'Press Start 2P', cursive;
    font-size:28px;
}

button:hover{
    opacity:0.9;
}
</style>

</head>
<body>

<div class="tituloSuperior">
    Feliz cumple Marii!!!!! <3
</div>

<div class="textoInferior">
    Made by: Valen
</div>

<button onclick="descargar()">
DESCARGAR
</button>

<script>
function descargar(){
    window.location.href = "/download";
}
</script>

</body>
</html>
